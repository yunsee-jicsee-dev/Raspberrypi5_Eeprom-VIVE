# viveboot 설정 - POSIX sh 로 source 된다. 값에 공백이 있으면 따옴표를 쓴다.
# 이 파일은 initramfs 안에도 복사된다. 고치면 update-initramfs -u 를 실행해야 한다.

# 토큰 장치를 못박는다. 비워 두면 작은 블록 장치를 훑어 헤더 magic 으로 찾는다.
# USB 플로피는 보통 /dev/sda 로 올라오지만 순서가 바뀔 수 있어 자동 탐색이 안전하다.
TOKEN_DEVICE=""

# 토큰이 나타날 때까지 기다릴 시간(초). USB 플로피는 스핀업이 느리므로 넉넉히 둔다.
TOKEN_WAIT=60

# 이 섹터 수보다 큰 장치는 토큰 후보에서 제외한다 (2880 = 1.44MB).
# 루트 디스크를 긁지 않기 위한 안전장치다.
TOKEN_MAX_SECTORS=8192

# 부팅마다 플로피의 카운터 섹터를 1 증가시킨다 (복제/롤백 탐지).
# 쓰기 금지 탭을 쓰거나 플로피 쓰기 수명을 아끼려면 no 로 둔다.
SEQ_UPDATE=yes

# PIN 입력 프롬프트 (토큰을 --ask-pin 으로 만든 경우에만 쓰인다).
PIN_PROMPT="VIVE 토큰 PIN: "

# 암호화 볼륨이 여러 개일 때 플로피를 한 번만 읽도록 initramfs 안에서만 캐시한다.
# 캐시는 switch_root 직전에 local-bottom 스크립트가 지운다.
CACHE_IKM=yes

# --- 한 번만 우회 (커널 커맨드라인) ---
# 커널 커맨드라인에 viveboot=off 가 있으면 토큰을 찾지 않고 LUKS 패스프레이즈를
# 묻는다 (cryptsetup 의 기본 동작과 같다). 토큰을 잃었을 때 initramfs 를 다시
# 만들지 않고 들어가는 길이며, 'vive-boot-mode bypass' 가 이 값을 넣고 뺀다.
#
# /boot/firmware/cmdline.txt 는 암호화되지 않은 FAT 파티션이므로 물리 접근자가
# 이 값을 넣을 수 있다. 넣어도 얻는 것은 '패스프레이즈를 묻는 화면'뿐이어서
# 기밀성은 그대로지만, 그 경로조차 막고 싶으면 no 로 둔다. no 로 두면 토큰을
# 잃었을 때의 복구는 initramfs 쉘뿐이다 (docs/recovery.md §4).
BYPASS_CMDLINE=yes

# 우회 모드에서 띄우는 프롬프트. 앞에 crypttab 의 매핑 이름이 붙는다.
BYPASS_PROMPT="패스프레이즈 (viveboot 우회): "

# --- 부팅 게이트 (암호화하지 않은 루트, vive-boot-gate) ---
# 토큰 확인을 몇 번 시도할지. 한 번에 최대 TOKEN_WAIT 초 기다린다.
GATE_TRIES=3
# 끝내 실패하면: poweroff (기본) | reboot
# initramfs 쉘로 떨어뜨리는 선택지는 일부러 두지 않았다 - 쉘이 곧 우회로다.
GATE_FAIL=poweroff

# --- 부팅 후 카운터 검사 (viveboot-seqcheck.service) ---
# warn     : 로그와 wall 메시지만 남긴다 (기본)
# poweroff : 불일치 시 즉시 전원을 끈다
# off      : 검사하지 않는다
SEQ_POLICY=warn

# 부팅 후 카운터 상태를 보관하는 경로. 암호화된 루트 안에 두어야 위조할 수 없다.
SEQ_STATE=/var/lib/viveboot/state
